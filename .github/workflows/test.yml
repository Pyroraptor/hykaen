name: GUT Test Suite

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run GUT headless tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Godot version pinned to a fixed release-binary URL (FEAT-039).
      # The version string is hardcoded directly in the URL — no shell
      # variable indirection — so the binary cannot drift silently.
      # Pin: Godot_v4.3-stable_linux.x86_64
      # ---------------------------------------------------------------
      - name: Install Godot 4 (pinned 4.3-stable)
        run: |
          curl -L "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      # ---------------------------------------------------------------
      # Linter 1: enforce pure GDScript domain (ADR-001)
      # No Godot Node/Control/CanvasItem inheritance in core/
      # ---------------------------------------------------------------
      - name: Lint — domain purity (ADR-001)
        run: |
          if grep -rn "extends Node\|extends Control\|extends CanvasItem" core/ 2>/dev/null; then
            echo "ERROR: core/ contains Godot framework inheritance. Domain layer must be pure GDScript." >&2
            exit 1
          fi
          echo "OK: no Node/Control/CanvasItem inheritance found in core/"

      # ---------------------------------------------------------------
      # Linter 2: enforce text-format resources (ADR-009)
      # No binary .scn/.res files outside addons/
      # ---------------------------------------------------------------
      - name: Lint — text-format resources (ADR-009)
        run: |
          VIOLATIONS=$(find . \( -name "*.scn" -o -name "*.res" \) ! -path "./addons/*" ! -path "./.git/*" 2>/dev/null)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Binary resource files found outside addons/:" >&2
            echo "$VIOLATIONS" >&2
            echo "All resources must be text-format (.tscn/.tres). See ADR-009." >&2
            exit 1
          fi
          echo "OK: no binary .scn/.res files found outside addons/"

      # ---------------------------------------------------------------
      # Linter 3: enforce injected RNG (ADR-002)
      # No direct randf/randi/RandomNumberGenerator.new() in core/
      # (rng.gd is the authorised exception — it defines the injectable)
      # ---------------------------------------------------------------
      - name: Lint — injected RNG (ADR-002)
        run: |
          if grep -rn "randf\|randi\b\|RandomNumberGenerator\.new()" core/ \
               --exclude="rng.gd" 2>/dev/null; then
            echo "ERROR: Direct RNG usage found in core/ (outside rng.gd). Use injected RNG. See ADR-002." >&2
            exit 1
          fi
          echo "OK: no direct RNG usage in core/ (excluding rng.gd)"

      # ---------------------------------------------------------------
      # Linter 4a: enforce spec approval gate (FEAT-084 hardened from FEAT-021)
      # docs/hollow-world-v0-spec.org MUST contain a #+APPROVAL: line signed
      # by 'Guy Verisage' specifically. The AI handle 'Sharding' (or any other
      # non-author signer) is rejected — only the human author is authoritative.
      # Uses grep -E with escaped '+' (\+) so the literal #+APPROVAL: prefix
      # is matched correctly in extended regex mode.
      # ---------------------------------------------------------------
      - name: lint-spec-approval-marker
        run: |
          grep -E '#\+APPROVAL:.*Guy Verisage' docs/hollow-world-v0-spec.org \
            && exit 0 \
            || { echo 'GATE FAIL: hollow-world-v0-spec.org missing or not signed by Guy Verisage' >&2; exit 1; }

      # ---------------------------------------------------------------
      # Linter 4a2: enforce #+STATUS: APPROVED gate (FEAT-084 / DEF-001)
      # docs/hollow-world-v0-spec.org #+STATUS must read APPROVED — a DRAFT
      # status or missing #+STATUS: line blocks merge until the author sets it.
      # ---------------------------------------------------------------
      - name: lint-spec-status-approved
        run: |
          grep '#+STATUS: APPROVED' docs/hollow-world-v0-spec.org \
            && exit 0 \
            || { echo 'GATE FAIL: hollow-world-v0-spec.org #+STATUS is not APPROVED (is DRAFT or missing)' >&2; exit 1; }

      # ---------------------------------------------------------------
      # Linter 4b: enforce genuine approval — no PLACEHOLDER (FEAT-039 / DEF-001)
      # The #+APPROVAL: line must NOT contain the word PLACEHOLDER.
      # Exit 1 blocks merge until the author replaces the stub text
      # with a genuine signed approval.
      #
      # FEAT-044 / DEF-005 cross-reference: the GUT tests in
      # tests/unit/test_spec_gate.gd (test_spec_approval_not_placeholder,
      # test_spec_has_approval_marker, test_spec_approval_has_content) now
      # mirror this gate exactly so local GUT runs catch the same condition
      # without needing to run the CI pipeline first.  Both gates must agree:
      # if this step exits 1, the corresponding GUT tests also fail.
      #
      # NOTE: uses { } grouped commands (not () subshell) so that exit 1
      # terminates the step shell directly — a subshell exit 1 would not
      # propagate through the || and would silently pass (DEF-001 fix).
      # ---------------------------------------------------------------
      - name: lint-spec-no-placeholder
        run: |
          grep -q PLACEHOLDER docs/hollow-world-v0-spec.org \
            && { echo 'GATE FAIL: hollow-world-v0-spec.org approval line still contains PLACEHOLDER' >&2; \
                 echo 'Replace the PLACEHOLDER with a genuine signed approval before merging.' >&2; \
                 exit 1; } \
            || true
          grep -qE '^\#\+APPROVAL:[[:space:]]*[^[:space:]]' docs/hollow-world-v0-spec.org \
            || { echo 'GATE FAIL: #+APPROVAL: line has no non-whitespace content after the colon' >&2; \
                 echo 'Add a genuine author sign-off after #+APPROVAL: before merging.' >&2; \
                 exit 1; }

      # ---------------------------------------------------------------
      # Linter 4c: enforce spec content keywords (FEAT-057 / DEF-NEW-001)
      # docs/hollow-world-v0-spec.org must contain genuine ruleset prose,
      # not just the structural stub that passes the approval-marker gate.
      # Checks:
      #   1. Body must NOT contain 'STUB placeholder' (stub detection)
      #   2. All seven attribute names must be present
      #   3. HP formula marker 'HP =' must be present
      #   4. All four defense keywords (AC, Reflex, Fortitude, Will)
      #   5. Action set keywords (Strike, Stride)
      #   6. Armor table marker ('ac_base' or '| Armor')
      #   7. Talent tree marker ('talent')
      # Each missing keyword or stub marker causes exit 1, blocking merge.
      # The human author (per ADR-004) must supply the actual ruleset prose.
      # ---------------------------------------------------------------
      - name: lint-spec-content-keywords
        run: |
          SPEC="docs/hollow-world-v0-spec.org"
          if grep -q 'STUB placeholder' "$SPEC"; then
            echo "GATE FAIL: $SPEC body contains 'STUB placeholder' — fill in real ruleset content before merging." >&2
            exit 1
          fi
          for attr in strength constitution dexterity willpower intellect intuition social; do
            grep -qi "$attr" "$SPEC" \
              || { echo "GATE FAIL: $SPEC missing attribute keyword: $attr" >&2; exit 1; }
          done
          grep -q 'HP =' "$SPEC" \
            || { echo "GATE FAIL: $SPEC missing HP formula marker 'HP ='" >&2; exit 1; }
          for kw in AC Reflex Fortitude Will; do
            grep -q "$kw" "$SPEC" \
              || { echo "GATE FAIL: $SPEC missing defense keyword: $kw" >&2; exit 1; }
          done
          for kw in Strike Stride; do
            grep -q "$kw" "$SPEC" \
              || { echo "GATE FAIL: $SPEC missing action keyword: $kw" >&2; exit 1; }
          done
          grep -qE 'ac_base|\| Armor' "$SPEC" \
            || { echo "GATE FAIL: $SPEC missing armor table marker ('ac_base' or '| Armor')" >&2; exit 1; }
          grep -q 'talent' "$SPEC" \
            || { echo "GATE FAIL: $SPEC missing talent tree marker 'talent'" >&2; exit 1; }
          echo "OK: all required content keywords present in $SPEC"

      # ---------------------------------------------------------------
      # GDScript static type-check gate (FEAT-040)
      # Runs Godot's built-in parser/type-checker across the whole project
      # in --check-only mode: no test logic executes, no scene is loaded.
      # Surfaces type-annotation errors, undefined variable references, and
      # missing return types as a distinct CI failure reason before the more
      # expensive GUT suite runs.  Exit code is forwarded directly; a non-
      # zero result blocks merge and appears under this named step for clear
      # attribution.
      # ---------------------------------------------------------------
      - name: GDScript Type Check
        run: |
          godot --headless --check-only --path .

      # ---------------------------------------------------------------
      # Entry-point smoke test (FEAT-041 / DEF-003)
      # Runs game/main.gd in headless check-only mode to prove the entry-
      # point script is syntactically and structurally valid in headless
      # mode.  Uses -s to target the specific entry-point file and
      # --check-only to parse + type-check it without requiring
      # SceneTree/MainLoop inheritance (game/main.gd extends Node, which
      # is correct for a scene script).  Runs AFTER the project-wide type-
      # check gate so errors are clearly attributable to the entry-point.
      # Exit 0 proves DEF-003 is resolved; any SCRIPT ERROR exits non-zero.
      # ---------------------------------------------------------------
      - name: Entry-Point Smoke Test (DEF-003)
        run: |
          godot --headless -s game/main.gd --check-only
          echo "OK: game/main.gd is syntactically and structurally valid in headless mode (DEF-003)"

      # ---------------------------------------------------------------
      # Run GUT headless test suite (FEAT-039: DEF-002 output capture)
      # Output is captured to gut_output.log via tee so the artifact-
      # upload step always finds a non-empty log file (pass or fail).
      # set -o pipefail ensures godot's exit code propagates through tee.
      # FEAT-010 DETERMINISM PROOF: test_steel_thread_e2e.gd runs
      # Encounter twice with seed 99999 and asserts byte-identical
      # roll + damage_final sequences — proving RNG reproducibility.
      # Exit 0 gates merge (branch protection rule).
      # ---------------------------------------------------------------
      - name: Run GUT tests (includes FEAT-010 steel thread determinism proof)
        run: |
          echo "--- DETERMINISM PROOF: FEAT-010 steel thread exercises Encounter with seed 99999 ---"
          echo "--- Expected output: 'STEEL THREAD VALIDATED: seed 99999, outcome <won|lost>, rounds <N>' ---"
          set -o pipefail
          godot --headless -- --gut-run-all 2>&1 | tee gut_output.log
          echo "--- GUT suite completed successfully (exit 0) ---"

      # ---------------------------------------------------------------
      # Upload GUT output as CI artifact (always, pass or fail)
      # gut_output.log is produced by the tee above (FEAT-039 DEF-002).
      # ---------------------------------------------------------------
      - name: Upload GUT output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-test-output-${{ github.run_number }}
          path: |
            gut_output.log
            *.log
            *.html
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------
  # Balance Simulation Gate (FEAT-048 / DEF-004)
  # Runs the balance invariant tests in tests/sim/ and blocks merge
  # if the v0 win-rate is outside [0.40, 0.80].  Distinct from the
  # main 'test' job so its failure is clearly attributable.
  # ---------------------------------------------------------------
  balance-simulation:
    name: Balance Simulation Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4 (pinned 4.3-stable)
        run: |
          curl -L "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      # ---------------------------------------------------------------
      # Run balance simulation GUT tests.
      # Propagates the Godot exit code through tee via pipefail so that
      # any test failure exits non-zero and blocks merge.
      # ---------------------------------------------------------------
      - name: Run balance simulation tests
        run: |
          set -o pipefail
          godot --headless -- --gut-run-all tests/sim/ 2>&1 | tee balance_sim_output.log

      # ---------------------------------------------------------------
      # Upload simulation output as CI artifact unconditionally
      # (if: always() ensures upload even when the step above fails).
      # ---------------------------------------------------------------
      - name: Upload balance simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-sim-results
          path: |
            balance_sim_output.log
            *.log
          if-no-files-found: ignore
          retention-days: 30
