# ci/pipeline.yml — FEAT-133 / FEAT-136 / FEAT-009 / US-011 / US-009
# (NFR-001, NFR-002, NFR-004, NFR-006, NFR-007, NFR-008, NFR-009; DEF-002,
# DEF-003)
#
# Canonical pipeline manifest for Hykaen's automated quality gate. This
# declares (rather than duplicates) the stages that scripts/test_command.sh
# runs, so the headless smoke test (FEAT-001) and the core/sim/simulator.gd
# N=1000 regression run are confirmed, in configuration, to be REQUIRED
# gate steps wired into the same pipeline as the rest of the pytest + GUT
# suite — not an optional/advisory side-channel.
#
# FEAT-136 (DEF-002/DEF-003): scripts/test_command.sh (declared below via
# `test_command:`) is THE single canonical script — the root-level
# `test_command` is now just a thin delegating wrapper around it (no stage
# list of its own), and .github/workflows/test.yml's CI job invokes
# scripts/test_command.sh directly rather than a hand-duplicated inline
# step list, so pytest and `godot --headless -- --gut-run-all` both
# genuinely execute in live CI, not just in local/manual runs.
#
# Process-level sign-off/findings tracking (e.g. V&V/PQA review gates) is
# out of scope here and is handled by downstream steps, not this file.
#
# FEAT-009 (US-009, NFR-001/002/006/007): two additional, standalone,
# independently-invokable architecture-compliance static-check gates are
# declared below —
#   - domain_purity_check      -> ci/check_domain_purity.sh   (ADR-001: no
#     Node/Control-descendant Godot inheritance anywhere under core/)
#   - no_duplicate_seams_check -> ci/check_no_duplicate_seams.sh
#     (ADR-002/ADR-006: exactly one _movement_used gate implementation and
#     exactly one concrete AI decision/token-reposition call path exist in
#     the codebase — no new/duplicate ports, use-cases, or seams).
# Both scripts already run as inline grep steps embedded directly in
# .github/workflows/test.yml's YAML ("Lint — domain purity (ADR-001)"),
# but that inline form cannot be run locally, unit-tested on its own, or
# reused by another gate. Extracting the same checks into real,
# independently-testable ci/*.sh artifacts (see
# tests/ci/test_static_checks.gd for the executable proof each one both
# passes against the real repository AND catches a deliberately injected
# violation) lets them be wired here as their own named, REQUIRED,
# non-optional stages, exactly like every other stage in this file.

name: hykaen-quality-gate

description: >
  Wires the headless smoke test (FEAT-001, tests/gut/test_smoke_boot.gd)
  and the core/sim/simulator.gd N=1000 balance regression
  (tests/sim/test_balance_sim.gd) into the same automated gate as the
  full pytest + GUT (--gut-run-all) suite, via a single canonical entry
  point (scripts/test_command.sh) that both the root test_command wrapper
  and live CI (.github/workflows/test.yml) now invoke, so no divergent
  stage list can exist (FEAT-136 / DEF-002 / DEF-003).

# The single command CI (and developers locally) invoke to run every
# stage below in one pass. See scripts/test_command.sh for the actual
# stage implementations — this file is the declarative source of truth
# for which stages are required/non-optional.
test_command: scripts/test_command.sh

stages:
  - id: headless_smoke_test
    name: Headless launchability smoke test (FEAT-001 / NFR-004 / NFR-006)
    description: >
      Boots MainScene.tscn headlessly via GUT, asserting autoload
      resolution, run/main_scene wiring, and first-frame processing with
      no unhandled errors. A fast, early gate ahead of the full suite.
    command: >-
      godot --headless -s addons/gut/gut_cmdln.gd
      -gdir=res://tests/gut -gselect=test_smoke_boot.gd -gexit
    required: true
    optional: false
    allow_failure: false

  - id: pytest_suite
    name: Python pytest suite
    description: >
      The full Python test suite — CI/infra and config assertions under
      tests/unit/*.py. HYKAEN_TEST_COMMAND_E2E_GUARD=1 makes the recursive
      end-to-end meta-tests (which shell out this very pipeline) skip inside the
      gate's own run — they still run when pytest is invoked standalone. This
      breaks the nested-gate recursion that intermittently flaked the pipeline.
    command: HYKAEN_TEST_COMMAND_E2E_GUARD=1 python -m pytest -q --tb=short
    required: true
    optional: false
    allow_failure: false

  - id: sim_results_provenance_check
    name: sim_results.json provenance guard (FEAT-239 / US-009, resolves PR-004, ADR-006)
    description: >
      Diffs the current commit against its parent and fails if
      sim_results.json's tracked metric keys (win_rate/avg_rounds/
      total_battles/confidence_interval) changed without a corresponding
      change to a sanctioned weapon/enemy data file (a *.tres resource
      under data/weapons/ or data/enemies/) in the same commit —
      preventing silent reaction-variance leakage into the checked-in
      balance-sim artifact (ADR-006). See
      tests/ci/test_check_sim_results_provenance.py.
    command: python scripts/ci/check_sim_results_provenance.py
    required: true
    optional: false
    allow_failure: false

  - id: gut_full_suite
    name: Full GUT headless regression suite (--gut-run-all)
    description: >
      Whole-project GDScript/GUT regression gate, including the FEAT-001
      headless smoke test and the N=1000 balance simulation.
    command: godot --headless -- --gut-run-all
    required: true
    optional: false
    allow_failure: false

  - id: balance_simulation_n1000
    name: core/sim/simulator.gd N=1000 balance regression (NFR-006 / NFR-008 / NFR-009)
    description: >
      Confirms the aggregate win-rate/outcome distribution from N=1000
      simulated encounters remains within existing tolerance
      ([0.40, 0.80]), an early-warning signal against accidental
      balance-constant drift. Already covered by gut_full_suite, but
      declared as its own explicit, required stage per US-011.
    command: >-
      godot --headless -s addons/gut/gut_cmdln.gd
      -gdir=res://tests/sim -gselect=test_balance_sim.gd -gexit
    required: true
    optional: false
    allow_failure: false

  - id: clean_tree_gate
    name: Automated clean-tree CI gate (FEAT-293 / US-011 / US-012, resolves PR-003 / PR-004 / PR-008 / PR-009)
    description: >
      Standalone, independently-invokable gate (scripts/verify_clean_tree.sh)
      wrapping `git status --porcelain` and failing the build the instant
      ANY pending change (staged, unstaged, or untracked) exists in the
      working tree. Wired in immediately after balance_simulation_n1000,
      the stage historically most likely to leave a generated-but-
      uncommitted artifact behind (e.g. the FEAT-292 res://sim_results.json
      regeneration, now gitignored precisely so it can't trip this gate).
      Turns CLAUDE.md's manual "run git status before finishing" commit-
      hygiene policy into a real, scripted, blocking CI gate rather than
      something only caught by manual reviewer inspection. See
      tests/ci/test_verify_clean_tree.py.
    command: scripts/verify_clean_tree.sh
    required: true
    optional: false
    allow_failure: false

  - id: consolidated_domain_suite
    name: GUT consolidated domain suite (tests/.gutconfig.json)
    description: >
      Scoped domain/application-layer gate (hex geometry, Combatant
      hex-coordinate init, melee reach gating, RoundSession, movement,
      flanking) under tests/unit/core, run via GUT's real CLI entry
      point so -gconfig= is honored rather than silently widened to the
      full project suite. Already covered by gut_full_suite, but
      declared as its own explicit, required stage (FEAT-136,
      reconciled from the former FEAT-004 test_command).
    command: >-
      godot --headless -s addons/gut/gut_cmdln.gd
      -gconfig=res://tests/.gutconfig.json -gexit
    required: true
    optional: false
    allow_failure: false

  - id: steel_thread_prologue_encounter_e2e
    name: Steel thread prologue-encounter E2E test
    description: >
      Headlessly boots the real res://MainScene.tscn composition root
      into prologue_encounter.tres and drives the COMPLETE steel thread
      end-to-end (tests/e2e/test_full_steel_thread_e2e.gd, FEAT-167):
      turn-start highlight, a movement Step/Stride, a player melee
      Strike, a full AI-controlled enemy turn, and the post-resolution
      ResultScreenView lock (Strike/EndTurn/Move all disabled, highlight
      cleared). DEF-002 fix (FEAT-172): this stage's -gselect/-gdir
      previously pointed at
      tests/integration/test_steel_thread_prologue_encounter.gd, so this
      dedicated, named gate never actually exercised the full steel
      thread E2E test directly — it only ran incidentally as part of
      gut_full_suite's whole-project sweep. The pairing below resolves
      directly to tests/e2e/test_full_steel_thread_e2e.gd, and
      tests/ci/test_pipeline_e2e_stage_config.py asserts this stays true.
    command: >-
      godot --headless -s addons/gut/gut_cmdln.gd
      -gselect=test_full_steel_thread_e2e.gd
      -gdir=res://tests/e2e -gexit
    required: true
    optional: false
    allow_failure: false

  - id: domain_purity_check
    name: Domain purity static check (FEAT-009 / US-009, ADR-001)
    description: >
      Standalone, independently-invokable gate asserting core/ contains
      zero bare 'extends Node'/'extends Control' Godot scene-tree
      inheritance (ADR-001 domain purity). Extracted from
      .github/workflows/test.yml's inline "Lint — domain purity" grep step
      into a real, unit-tested artifact (see
      tests/ci/test_static_checks.gd, which proves this script both
      passes against the real core/ tree and catches a deliberately
      injected violation).
    command: ci/check_domain_purity.sh core
    required: true
    optional: false
    allow_failure: false

  - id: no_duplicate_seams_check
    name: No duplicate ports/use-cases/seams check (FEAT-009 / US-009, ADR-002/ADR-006)
    description: >
      Standalone, independently-invokable gate confirming exactly one
      _movement_used gate implementation (core/rules/action_economy.gd)
      and exactly one concrete AI decision (decide_action) and
      token-reposition (move_token) call path exist across core/,
      presentation/, and infrastructure/ — no new/duplicate port,
      use-case, or seam has been introduced (ADR-002/ADR-006). See
      tests/ci/test_static_checks.gd for the executable proof this script
      passes against the real repository and catches each kind of
      injected duplicate.
    command: ci/check_no_duplicate_seams.sh
    required: true
    optional: false
    allow_failure: false

  - id: baseline_diff_regression
    name: Pinned-seed baseline-diff regression gate (FEAT-255, resolves PR-004 / RISK-006)
    description: >
      Re-drives the Effects Applier retrofit's player-Strike (US-004),
      enemy-on-hit-reaction (US-005), and END_TURN (US-012) boot-real
      scenarios at the pinned seed=42 fixture and asserts hp outcome,
      AttackEvent fields, the rendered combat-log line, and the full
      round-event sequence all diff to ZERO against the checked-in
      tests/regression/fixtures/baseline_*_seed42.json snapshots —
      turning RISK-006's previously-manual "no behavior change" diff step
      into a durable, automated, gating artifact so a future change can
      never silently reintroduce drift. See
      tests/regression/test_baseline_diff_regression.gd.
    command: >-
      godot --headless -s addons/gut/gut_cmdln.gd
      -gselect=test_baseline_diff_regression.gd
      -gdir=res://tests/regression -gexit
    required: true
    optional: false
    allow_failure: false

gate:
  # A single failing stage aborts the pipeline; scripts/test_command.sh
  # enforces this at the shell level via `set -euo pipefail`.
  fail_fast: true
  exit_non_zero_on_any_stage_failure: true
